services:
  api:
    build: ./api
    ports:
      - "5000:5000"
    environment:
      MQTT_TOPIC: "${MQTT_TOPIC:-edge/2ano/2CCPH/equipe11/ff84fafa1219/dados}"
      MQTT_CLIENT_ID: "${MQTT_CLIENT_ID:-api-ff84fafa1219}"
    restart: unless-stopped
  dashboard:
    build: ./dashboard
    ports:
      - "5001:5001"
    environment:
      API_URL: "http://api:5000/dados"
    depends_on:
      - api
    restart: unless-stopped
